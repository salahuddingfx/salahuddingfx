<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 260" width="910" height="260">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@700&family=Space+Mono:wght@700&display=swap');
      ]]>
    </style>
  </defs>

  <!-- Banner Shadow -->
  <rect x="12" y="12" width="880" height="230" fill="#000000" rx="8" />
  
  <!-- Banner Main Body -->
  <rect x="0" y="0" width="880" height="230" fill="#FFDE4D" stroke="#000000" stroke-width="4.5" rx="8" />

  <!-- Grid decoration on background (dots) -->
  <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#e0af68" opacity="0.4" />
  </pattern>
  <rect x="5" y="5" width="870" height="220" fill="url(#dotGrid)" rx="6" pointer-events="none" />

  <!-- Tilted Sticker (Top Left) -->
  <g transform="rotate(-6, 80, 15)">
    <rect x="42" y="5" width="125" height="26" fill="#000000" rx="4" />
    <rect x="38" y="1" width="125" height="26" fill="#FF007F" stroke="#000000" stroke-width="2.2" rx="4" />
    <text x="100" y="18" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CREATIVE MIND</text>
  </g>

  <!-- Name -->
  <text x="40" y="90" font-family="'Archivo Black', 'Arial Black', Impact, sans-serif" font-size="48" font-weight="900" fill="#000000" letter-spacing="-1">SALAH UDDIN KADER</text>

  <!-- Subtitle Badge Shadow -->
  <rect x="44" y="124" width="455" height="38" fill="#000000" rx="4" />
  <!-- Subtitle Badge Main -->
  <rect x="40" y="120" width="455" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="4" />
  <text x="267" y="144" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">FULL STACK AI ENGINEER // CREATIVE DEVELOPER</text>

  <!-- Mini stack badges below subtitle -->
  <!-- MERN Badge -->
  <rect x="44" y="179" width="75" height="28" fill="#000000" rx="4" />
  <rect x="40" y="175" width="75" height="28" fill="#bb9af7" stroke="#000000" stroke-width="2.2" rx="4" />
  <text x="77.5" y="193" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">MERN</text>

  <!-- GSAP Badge -->
  <rect x="134" y="179" width="75" height="28" fill="#000000" rx="4" />
  <rect x="130" y="175" width="75" height="28" fill="#39FF14" stroke="#000000" stroke-width="2.2" rx="4" />
  <text x="167.5" y="193" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">GSAP</text>

  <!-- VITE Badge -->
  <rect x="224" y="179" width="75" height="28" fill="#000000" rx="4" />
  <rect x="220" y="175" width="75" height="28" fill="#00E5FF" stroke="#000000" stroke-width="2.2" rx="4" />
  <text x="257.5" y="193" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">VITE</text>

  <!-- Graphic Stars & Accents -->
  <path d="M 525 65 L 528 75 L 538 78 L 528 81 L 525 91 L 522 81 L 512 78 L 522 75 Z" fill="#00E5FF" stroke="#000000" stroke-width="2" />
  <path d="M 335 180 L 337 186 L 343 188 L 337 190 L 335 196 L 333 190 L 327 188 L 333 186 Z" fill="#FF007F" stroke="#000000" stroke-width="1.8" />

  <!-- Terminal Window Widget -->
  <!-- Terminal Window Shadow -->
  <rect x="568" y="42" width="290" height="170" fill="#000000" rx="6" />
  <!-- Terminal Window Body -->
  <rect x="560" y="34" width="290" height="170" fill="#0d1117" stroke="#000000" stroke-width="4.5" rx="6" />
  <!-- Terminal Header -->
  <rect x="560" y="34" width="290" height="32" fill="#00E5FF" stroke="#000000" stroke-width="4.5" rx="6" />
  <!-- Cover rounded corner overlap of header -->
  <rect x="562.5" y="55" width="285" height="10" fill="#0d1117" />
  
  <!-- Window Controls -->
  <circle cx="580" cy="50" r="5" fill="#f7768e" stroke="#000000" stroke-width="1.8" />
  <circle cx="595" cy="50" r="5" fill="#e0af68" stroke="#000000" stroke-width="1.8" />
  <circle cx="610" cy="50" r="5" fill="#9ece6a" stroke="#000000" stroke-width="1.8" />
  <text x="715" y="54" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">salahuddin@terminal: ~</text>

  <!-- Terminal Content with Colored Text (Using system fallback monospace fonts inline) -->
  <g transform="translate(578, 88)">
    <text x="0" y="0" font-family="'Space Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#9ece6a">> loc: Cox's Bazar, BD 🌴</text>
    <text x="0" y="24" font-family="'Space Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#7aa2f7">> status: active &amp; designing</text>
    <text x="0" y="48" font-family="'Space Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#bb9af7">> stack: MERN Stack</text>
    <text x="0" y="72" font-family="'Space Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#f7768e">> focus: AI Agent UI/UX</text>
    <text x="0" y="96" font-family="'Space Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#e0af68">> site: salahuddin.codes</text>
  </g>
</svg>